<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BSP Store — 라이선스 발급</title>
<style>
  :root{--blue:#3080ff;--orange:#fe6e00;--ink:#050505;--panel:#0d0f13;--line:#222834;
        --text:#e8ecf3;--muted:#9aa4b5;--ok:#22c55e;--warn:#fb2c36;
        --mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  h1 span{color:var(--blue)}
  p.lead{color:var(--muted);font-size:14px;margin:0 0 28px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em}
  label:first-child{margin-top:0}
  input{width:100%;background:#07090d;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
        color:var(--text);font-family:var(--mono);font-size:14px}
  input:focus{outline:none;border-color:var(--blue)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  button{margin-top:18px;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14px;
         cursor:pointer;font-family:inherit;background:var(--orange);color:#fff}
  button:hover{background:#f05100}
  .out{margin-top:18px;background:#07090d;border:1px dashed var(--line);border-radius:10px;padding:16px;
       font-family:var(--mono);font-size:13px;color:var(--muted);word-break:break-all;white-space:pre-wrap;min-height:22px}
  .out.ok{color:var(--ok);border-color:rgba(34,197,94,.4)}
  .out.no{color:var(--warn);border-color:rgba(251,44,54,.4)}
  .note{color:var(--muted);font-size:13px;line-height:1.75}
  .note code{font-family:var(--mono);color:#54a2ff}
  a{color:#54a2ff}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>BSP</span> 라이선스 발급</h1>
  <p class="lead">관리자만 씁니다. 발급한 키를 사용자에게 주면 런처에 넣습니다.</p>

  <div class="box">
    <label for="tok">관리자 토큰</label>
    <input id="tok" type="password" placeholder="Vercel 환경변수 ADMIN_TOKEN" autocomplete="off" />

    <label for="org">회사 · 팀</label>
    <input id="org" type="text" placeholder="삼성 파트너 / 설계2팀" />

    <div class="row">
      <div>
        <label for="seats">좌석 수</label>
        <input id="seats" type="text" value="10" />
      </div>
      <div>
        <label for="exp">만료일</label>
        <input id="exp" type="text" value="2027-12-31" />
      </div>
    </div>

    <button id="go">키 발급</button>
    <div class="out" id="out"></div>
  </div>

  <div class="box note">
    <b style="color:var(--text)">키에 대해</b><br>
    키 자체가 회사·좌석·만료일을 담고 서명돼 있습니다. 그래서 DB 없이도 확인됩니다.<br>
    되돌리기(회수)가 필요해지면 <code>LICENSE_SECRET</code> 을 바꾸면 그 전 키가 전부 무효가 되고,
    개별 회수·발급 이력이 필요하면 <code>/api/issue</code> 에서 DB 에 한 줄 적으면 됩니다.<br><br>
    <b style="color:var(--text)">환경변수</b><br>
    <code>LICENSE_SECRET</code> — 키 서명용 (아무 긴 문자열)<br>
    <code>ADMIN_TOKEN</code> — 이 페이지에서 쓰는 관리자 토큰<br><br>
    <a href="/">← 스토어로</a>
  </div>
</div>

<script>
document.getElementById("go").onclick = async () => {
  const out = document.getElementById("out");
  out.className = "out"; out.textContent = "발급 중…";
  try{
    const r = await fetch("/api/issue", {
      method:"POST",
      headers:{ "content-type":"application/json", "x-admin-token": document.getElementById("tok").value.trim() },
      body: JSON.stringify({
        org: document.getElementById("org").value.trim(),
        seats: Number(document.getElementById("seats").value) || 1,
        expires: document.getElementById("exp").value.trim()
      })
    });
    const d = await r.json();
    if(d.ok){
      out.className = "out ok";
      out.textContent = d.key + "\n\n" + d.org + " · 좌석 " + d.seats + " · 만료 " + d.expires;
      navigator.clipboard && navigator.clipboard.writeText(d.key);
    }else{
      out.className = "out no";
      out.textContent = "발급 실패 : " + (d.reason || r.status);
    }
  }catch(e){
    out.className = "out no";
    out.textContent = "서버에 닿지 못했습니다 : " + e.message;
  }
};
</script>
</body>
</html>
